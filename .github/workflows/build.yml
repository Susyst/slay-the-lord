name: Build desktop apps
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            args: --target universal-apple-darwin
            name: macOS
          - os: windows-latest
            args: ""
            name: Windows
          - os: ubuntu-22.04
            args: ""
            name: Linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.os == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - name: Linux build dependencies
        if: matrix.os == 'ubuntu-22.04'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - run: npm ci
        working-directory: app
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: app
          args: ${{ matrix.args }}
          tagName: v__VERSION__
          releaseName: "Pokemon? Slay the Lord v__VERSION__"
          releaseBody: "Mac: open the .dmg, drag the app to Applications, then right-click it and choose Open the first time (it is unsigned). Windows: run the .exe installer; click More info, then Run anyway on the SmartScreen prompt."
          releaseDraft: false
          prerelease: false
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: |
            app/src-tauri/target/**/release/bundle/dmg/*.dmg
            app/src-tauri/target/**/release/bundle/nsis/*.exe
            app/src-tauri/target/**/release/bundle/appimage/*.AppImage
            app/src-tauri/target/release/bundle/dmg/*.dmg
            app/src-tauri/target/release/bundle/nsis/*.exe
            app/src-tauri/target/release/bundle/appimage/*.AppImage
          if-no-files-found: ignore

  # The Android APK. Built on the runner rather than from a committed gen/android,
  # so the Gradle project is always regenerated against the NDK that is actually present.
  # This produces a DEBUG-SIGNED universal APK: installable by sideloading (enable
  # "install unknown apps" on the phone), but not Play Store material. For a store
  # build, add a keystore as repo secrets and switch the build step to --apk without
  # --debug, with signing config in gen/android/keystore.properties.
  android:
    needs: build
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-34 build-tools;34.0.0 ndk;27.2.12479018"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android
      - run: npm ci
        working-directory: app
      - name: Scaffold the Android project
        working-directory: app
        env:
          NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/27.2.12479018
        run: npx tauri android init --ci
      - name: Build the APK
        working-directory: app
        env:
          NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/27.2.12479018
        run: npx tauri android build --apk --debug
      - name: Find it
        id: apk
        run: |
          path=$(find app/src-tauri/gen/android -name '*.apk' | head -1)
          echo "path=$path" >> "$GITHUB_OUTPUT"
          echo "Built $path"
      - uses: actions/upload-artifact@v4
        with:
          name: Android
          path: app/src-tauri/gen/android/**/*.apk
          if-no-files-found: error
      - name: Attach it to the release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          v=$(node -p "require('./app/src-tauri/tauri.conf.json').version")
          cp "${{ steps.apk.outputs.path }}" "Slay.the.Lord_${v}_android.apk"
          gh release upload "v$v" "Slay.the.Lord_${v}_android.apk" --clobber
